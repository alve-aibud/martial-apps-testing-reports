/* ---- LIGHT: the app's cream canvas with white cards ----
   SELECTORS ARE CHOSEN FOR SPECIFICITY, not style. Allure scopes its own
   surfaces as ":root:not([data-theme=dark])" for light and
   ":root[data-theme=dark]" for dark - both (0,2,0). Its bundle also injects
   that stylesheet at RUNTIME, so it lands after this block in the DOM and wins
   every equal-specificity tie. Plain ":root" (0,1,0) and "html:root" (0,1,1)
   both LOSE - measured: the token took the new value and the page still
   painted Allure's colours. Mirroring their selectors with a leading "html"
   gives (0,2,1), which wins by one. ---- */
html:root:not([data-theme="dark"]) {
  /* Cream everywhere the app is cream. The card stays near-white so test
     rows keep their contrast, but it is cream-50 rather than pure #FFF so
     the whole surface reads warm rather than clinical. */
  /* Canvas one step deeper than the app's zen-white so the white card
     actually reads as a card. At cream-100 against cream-50 the two were
     within 5 RGB points and the page looked flat. */
  --color-bg-canvas:    #EEEEE8;
  --color-bg-primary:   #FFFFFF;
  --color-bg-secondary: #FEF2F4;
  --color-bg-raised:    #FFFFFF;
  --color-bg-neutral:   #EEEEE8;
  --color-bg-overlay:   #FAFAF7;

  /* Inverse surfaces (tooltips, solid chips) carry the brand outright. */
  --color-bg-inverse-primary: #BC002D;
  --color-bg-inverse-raised:  #A60028;
  --color-text-inverse:           #FFFFFF;
  --color-text-inverse-secondary: #FDE6EA;
  --color-text-on-accent:         #FFFFFF;

  --color-text-primary:   #0F172A;
  --color-text-secondary: #334155;
  --color-text-muted:     #64748B;

  /* Warm/crimson-tinted borders instead of neutral grey - this is most of
     what makes the report read as "branded" rather than "stock with a red
     link". */
  --color-border-subtle:         #FDE6EA;
  --color-border-default:        #FBC1CA;
  --color-border-medium:         #F891A3;
  --color-border-strong:         #F15A78;
  --color-border-control:        #E0E0D8;
  --color-border-inverse-strong: #A60028;
}

/* ---- a crimson rule across the top of the page ----
   Not a token - the tokens can only tint what Allure already paints, and
   nothing it paints is a brand bar. This is the one additive rule in the
   file. Fixed, 4px, above the app chrome; it sits over nothing interactive.
   Gradient runs crimson-500 -> crimson-400, the same pair the app uses for
   its own primary/hover. ---- */
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto 0;
  height: 4px;
  background: linear-gradient(90deg, #BC002D 0%, #F15A78 100%);
  z-index: 9999;
  pointer-events: none;
}

/* ---- the logo in dark mode ----
   The mark is the brand's RED variant (logo-red.svg, #bc002d), chosen because
   light is the default theme. On the slate-950 dark canvas that is dark-red on
   near-black and barely reads. The plugin takes ONE logo value, so it cannot
   ship a light variant for dark mode - lifting it with a filter is the only
   lever short of shipping a second file and swapping it in JS.
   Targeted on alt text, not the class: the class is a build hash
   ("report-logo__OOEnL") and changes on every Allure release. ---- */
html:root[data-theme="dark"] img[alt="report logo"] {
  filter: brightness(1.75) saturate(1.15);
}

/* ---- DARK: the app's slate scale. Same specificity note as above. ---- */
html:root[data-theme="dark"] {

  --color-bg-primary:   #0F172A;
  --color-bg-secondary: #1E293B;
  --color-bg-raised:    #1E293B;
  --color-bg-neutral:   #1E293B;

  --color-text-primary:   #F8FAFC;
  --color-text-secondary: #CBD5E1;
  --color-text-muted:     #94A3B8;

  --color-border-subtle:  #1E293B;

  --color-border-medium:  #334155;
  --color-border-control: #334155;
}
